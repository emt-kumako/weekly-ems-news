[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-ems-news"
version = "0.1.0"
description = "Personal weekly EMS digest assembler for Taiwan-focused prehospital practice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "certifi>=2024.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
weekly-ems = "weekly_ems_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["weekly_ems_news"]
mypy_path = "src"
strict = true
warn_unreachable = true
